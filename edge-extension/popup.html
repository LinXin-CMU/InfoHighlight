<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head><body><h1><img src="icons/infolens.svg" width="28" height="28" alt="">InfoLens Local</h1><p>本机 GPU · 正文不外发 · v0.8.13</p><button id="analyze">分析当前网页</button><div id="status" role="status" aria-live="polite">连接本机服务中…</div><label><input id="site-auto" type="checkbox"> 此站点自动分析</label><p id="site-note"></p><button id="pause">暂停 / 清除高亮</button><label>阅读信号<select id="mode"><option value="hybrid">融合 · 重点句内分层（推荐）</option><option value="information_density">快速 · 仅信息密度</option><option value="semantic_importance">语义 · 句子重要度</option></select></label><p id="mode-note">先显示信息密度，再逐句补充重要度。</p><label id="fusion-control">融合方式<select id="fusion"><option value="semantic_floor">重点句内分层 · 两倍醒目词</option><option value="weighted">加权加法</option><option value="gated">乘法门控</option></select></label><label id="weight-control" hidden>信息密度权重 <output id="weight">40%</output><input id="alpha" type="range" min="0" max="100" value="40" step="5"></label><label>高亮样式<select id="style"><option value="background">背景色</option><option value="foreground">文字色</option><option value="underline">下划线</option><option value="fade">弱化低分文字</option></select></label><label>高亮颜色</label><div id="colors" aria-label="预设颜色"></div><input id="hue" aria-label="色相" type="range" min="0" max="360" value="0"><label>强度 <output id="value">100%</output><input id="intensity" type="range" min="0" max="150" value="100" step="5"></label><small>首次点击授权当前页。暂不支持内置 PDF、跨域 iframe 或扫描件。</small></body></html>
